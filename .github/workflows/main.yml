name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "."
          target: ${{ secrets.APP_DIR }}_dev
          exclude: ".git,node_modules,.env,*.log,docker-compose.yml"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          
          script: |
            set -e

            APP_DIR="${{ secrets.APP_DIR }}_dev"
            TRELLO_API_KEY="${{ secrets.TRELLO_API_KEY }}"
            TRELLO_TOKEN="${{ secrets.TRELLO_TOKEN }}"
            TRELLO_BOARD_ID="${{ secrets.TRELLO_BOARD_ID }}"
            ROUTER_API_KEY="${{ secrets.ROUTER_API_KEY }}"
            TRELLO_LIST_ID="${{ secrets.TRELLO_LIST_ID }}"
            
            POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}"
            POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}"
            POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

            # Создаём директорию приложения, если её нет
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Безопасно генерируем .env файл
            cat > .env <<EOF
            TRELLO_API_KEY=$TRELLO_API_KEY
            TRELLO_TOKEN=$TRELLO_TOKEN
            TRELLO_BOARD_ID=$TRELLO_BOARD_ID
            ROUTER_API_KEY=$ROUTER_API_KEY
            TRELLO_LIST_ID=$TRELLO_LIST_ID
            POSTGRES_HOST=$POSTGRES_HOST
            POSTGRES_PORT=$POSTGRES_PORT
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            EOF

            # Ограничиваем права доступа
            chmod 600 .env

            # Сборка образа
            docker build -t app-dev .

            # Постоянное хранилище ChromaDB между деплоями
            docker volume create app-dev-chroma-db >/dev/null

            healthcheck() {
              PORT="$1"
              CONTAINER="$2"

              for i in $(seq 1 30); do
                if curl -fsS "http://localhost:${PORT}/app/v1/heartbeat" >/dev/null; then
                  echo "Healthcheck passed for ${CONTAINER}"
                  return 0
                fi

                if [ "$i" -eq 30 ]; then
                  echo "Healthcheck failed for ${CONTAINER}"
                  docker logs "$CONTAINER"
                  return 1
                fi

                sleep 2
              done
            }

            # Проверяем новый контейнер до остановки текущего app
            docker rm -f app-dev-new 2>/dev/null || true
            docker run -d \
              --name app-dev-new \
              --env-file .env \
              -v app-dev-chroma-db:/app/db/chroma_db \
              -p 8801:8000 \
              app

            if ! healthcheck 8801 app-dev-new; then
              docker rm -f app-dev-new 2>/dev/null || true
              exit 1
            fi

            # Новый образ проверен, теперь можно переключать production container
            docker stop app-dev 2>/dev/null || true
            docker rm app-dev 2>/dev/null || true
            docker rm -f app-dev-new 2>/dev/null || true

            # Запускаем новый контейнер с .env
            docker run -d \
              --name app-dev \
              --env-file .env \
              -v app-dev-chroma-db:/app/db/chroma_db \
              -p 8800:8000 \
              --restart unless-stopped \
              app-dev

            healthcheck 8800 app-dev

            # Очищаем старые образы
            docker image prune -f

            echo "✅ Деплой завершён успешно!"
